apiVersion: v1
kind: Pod
metadata:
  name: naughty-hostpath
  namespace: audit-zone
spec:
  containers:
    - name: busybox
      image: busybox:latest
      command: ["sleep", "3600"]
      volumeMounts:
        - name: host-volume
          mountPath: /host-data
  volumes:
    - name: host-volume
      hostPath:
        path: /tmp
        type: Directory
